name: Release

# Push a tag like v0.1.0 (or run the workflow with a version) to build a signed release APK and publish it as a GitHub Release.
# Needs the repository secrets KEYSTORE (base64 of the keystore file), KEYSTORE_PASSWORD,
# KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD (if empty, the keystore password is used).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create for this commit, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE is not set"
            exit 1
          fi
          if ! echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::Secret KEYSTORE must be the base64 of the keystore file (base64 -w0 release.jks)"
            exit 1
          fi
      - name: Build, test and sign
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "virt-manager-android-$TAG.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: virt-manager-android-${{ env.TAG }}.apk
          generate_release_notes: true
